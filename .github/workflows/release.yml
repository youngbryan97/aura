name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  macos-sign-notarize:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Require signing credentials
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:     ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_DEVELOPER_ID"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.0.0-beta.18
      - name: Install Python deps
        run: |
          # `pip install -r requirements/runtime.txt || pip install -r
          # requirements.txt || true` used to stand here. requirements/runtime.txt
          # has never existed, so the first install always failed; the `|| true`
          # let the second fail too, and the job went on to sign and notarize a
          # bundle built against whatever happened to be in the image.
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install --require-hashes -r requirements_lock.txt
      - name: Build (unsigned)
        env:
          AURA_BUILD_PROFILE: release
        working-directory: native/aura-shell
        run: |
          cargo tauri build
      - name: Sign + notarize
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:     ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE=native/aura-shell/target/release/bundle/macos/Aura.app
          codesign --deep --force --options runtime \
            --entitlements Aura.entitlements \
            --sign "$APPLE_DEVELOPER_ID" "$BUNDLE"
          ditto -c -k --keepParent "$BUNDLE" Aura.zip
          xcrun notarytool submit Aura.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$BUNDLE"
      - name: Generate SBOM and provenance
        run: |
          . .venv/bin/activate
          python tools/build_provenance.py --output-dir artifacts/provenance
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: aura-macos
          path: |
            native/aura-shell/target/release/bundle/macos/*.app
            native/aura-shell/target/release/bundle/dmg/*.dmg
            artifacts/provenance/sbom.json
            artifacts/provenance/provenance.json
