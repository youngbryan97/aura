<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Luna</title>
<style>
:root { color-scheme: light dark;
  --ink:#14171a; --paper:#fbfbfa; --line:#d8d6d1; --quiet:#6b6f76; --accent:#2f5d50; }
@media (prefers-color-scheme: dark) {
  :root { --ink:#ecebe8; --paper:#16181a; --line:#33373b; --quiet:#9aa0a6; --accent:#7fbfa8; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
.slide { min-height:100vh; padding:9vh 8vw; display:none; flex-direction:column; justify-content:center; }
.slide.on { display:flex; }
.slide h1 { font-size:clamp(1.8rem,4vw,3rem); font-weight:600; letter-spacing:-0.02em; margin:0 0 2rem; }
.slide h2 { font-size:clamp(1.4rem,3vw,2.2rem); font-weight:600; letter-spacing:-0.01em; margin:0 0 1.6rem; }
.slide .sub { color:var(--quiet); font-size:1.1rem; margin-top:-1.2rem; margin-bottom:2rem; }
.slide ul { margin:0; padding:0; list-style:none; max-width:52rem; }
.slide li { position:relative; padding-left:1.4rem; margin-bottom:1rem; font-size:clamp(1rem,1.6vw,1.25rem); }
.slide li::before { content:""; position:absolute; left:0; top:0.62em; width:0.5rem; height:1px; background:var(--accent); }
.bar { position:fixed; left:0; bottom:0; height:2px; background:var(--accent); transition:width .2s; }
.count { position:fixed; right:1.5rem; bottom:1.2rem; color:var(--quiet); font-size:0.8rem;
  font-variant-numeric:tabular-nums; }
.notes { display:none; }
@media print { .slide { display:flex; page-break-after:always; min-height:auto; } .bar,.count { display:none; } }
</style>
</head>
<body>
<section class="slide on"><h1>Aura Luna</h1></section><section class="slide"><h2>Slide 1</h2><ul><li>point 1a</li><li>point 1b</li></ul></section><section class="slide"><h2>Slide 2</h2><ul><li>point 2a</li><li>point 2b</li></ul></section><section class="slide"><h2>Slide 3</h2><ul><li>point 3a</li><li>point 3b</li></ul></section><section class="slide"><h2>Slide 4</h2><ul><li>point 4a</li><li>point 4b</li></ul></section><section class="slide"><h2>Slide 5</h2><ul><li>point 5a</li><li>point 5b</li></ul></section><section class="slide"><h2>Slide 6</h2><ul><li>point 6a</li><li>point 6b</li></ul></section>
<div class="bar" style="width:14.29%"></div>
<div class="count">1 / 7</div>
<script>
const slides = Array.from(document.querySelectorAll('.slide'));
const bar = document.querySelector('.bar');
const count = document.querySelector('.count');
let at = 0;
function show(next) {
  at = Math.max(0, Math.min(slides.length - 1, next));
  slides.forEach((slide, index) => slide.classList.toggle('on', index === at));
  bar.style.width = ((at + 1) / slides.length * 100).toFixed(2) + '%';
  count.textContent = (at + 1) + ' / ' + slides.length;
}
document.addEventListener('keydown', (event) => {
  if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); show(at + 1); }
  if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); show(at - 1); }
  if (event.key === 'Home') show(0);
  if (event.key === 'End') show(slides.length - 1);
});
document.addEventListener('click', (event) => show(at + (event.clientX < window.innerWidth / 3 ? -1 : 1)));
show(0);
</script>
</body>
</html>
