<!doctype html>
<html lang="en" data-aura-scheme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aura</title>
<link rel="stylesheet" href="/static/design_tokens.css"/>
<style>
/*
  The bubble. Small, detached, draggable, and silent until she has something.

  Two states and nothing else:

    dormant   just the neuron. No bar, no label, no placeholder text. A
              placeholder like "What can I help you with today?" is chrome
              asking to be noticed; this surface does not ask.
    speaking  the neuron plus one line of what she said, and a dismiss.

  The whole window is transparent and click-through except the glyph and the
  message, so a bubble sitting over an editor does not eat clicks meant for
  the editor.
*/
:root {
  --bubble-bg: rgba(22, 20, 32, 0.92);
  --bubble-edge: rgba(160, 130, 255, 0.28);
  --bubble-text: #e8e2f6;
  --bubble-dim: rgba(232, 226, 246, 0.55);
  /* drop-shadow, not box-shadow: the glow has to follow the neuron's own
     silhouette. A box-shadow haloed the square <img> bounding box, which is
     why the resting mark read as a disc inside a disc. */
  --neuron-idle: none;
  --neuron-live: drop-shadow(0 0 5px rgba(150, 110, 255, 0.7));
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  overflow: hidden;
  /* The window is a passthrough by default; only the pill takes clicks. */
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
}

#pill {
  pointer-events: auto;
  position: absolute;
  left: 8px; top: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 9px;
  border-radius: 999px;
  background: var(--bubble-bg);
  border: 1px solid var(--bubble-edge);
  /* Every shadow fades out inside the 8px the panel leaves around the pill
     (bubble.js sizes the panel to the pill plus 16). Reported 15 November
     2026: "i can see the slightly shaded square around the circle". The
     shadow reached 18px past the disc and the panel's square edge cut it off.
     No backdrop blur either: behind a 0.9-alpha scrim it showed nothing. */
  box-shadow: 0 2px 6px rgba(0,0,0,0.34);
  /* AppKit resizes the native panel to this measured content. Keeping this
     independent of the current viewport lets a 40px dormant panel grow again
     when a message arrives. */
  max-width: 504px;
  /* Dragging is implemented in bubble.js, which posts a delta to the native
     host. This used to say `-webkit-app-region: drag` with a comment that
     "macOS moves the panel from here" — that property is Electron's, WKWebView
     does not implement it, and the bubble could not be moved at all. */
  cursor: grab;
  transition: padding 140ms ease, background 200ms ease;
}

/*
  Dormant is the neuron and nothing else.

  It used to be a bordered disc with a 26px glyph floating inside 7px of
  padding, and the glyph carried its own border-radius and glow — so the
  resting state was a ring inside a ring around a shrunken mark. Three
  concentric shapes to say one thing.

  What is left is a scrim, not a button: no border, sized snugly to the mark,
  dark enough that a light-coloured neuron still reads over a white editor.
  The disc is there for legibility over an unknown background, which is the
  only thing it is allowed to be there for.
*/
#pill.dormant {
  padding: 6px;
  gap: 0;
  background: rgba(20, 18, 30, 0.9);
  /* One faint edge, not the old ring-around-a-ring. It has to be readable
     enough that the unread dot looks like it is ON something — at 0.72 alpha
     over a dark editor the disc vanished and the dot read as a loose speck
     floating beside the neuron. */
  border-color: rgba(160, 130, 255, 0.16);
  box-shadow: 0 1px 5px rgba(0,0,0,0.32);
}

#glyph {
  /* One size in every state. Growing the mark when she stops speaking is a
     tic: the eye reads a resize in the corner of the screen as something
     having happened, and nothing has. Snug in 6px of scrim, so the resting
     bubble is 48px across.

     36px, not 28px, and the reason is arithmetic rather than taste — reported
     live 2026-08-10, "would still also like the icon to be a bit sharper".
     The artwork is authored in a 50-unit viewBox, so at 28px each unit was
     0.56 CSS px and, at 2x, 1.12 device px. Its three stroke weights (1.1,
     1.5, 1.6) therefore landed at 1.23, 1.68 and 1.79 DEVICE pixels: every
     line in the mark was under two pixels wide, so all of them were spread
     across two or three pixels of antialiasing with no full-intensity core.
     That is what "not sharp" looks like, and no amount of adjusting the glow
     could have fixed it, because the glow is merged UNDER the source and the
     edges were never the glow's doing.

     At 36px a unit is 1.44 device px and the same three weights land at 1.58,
     2.16 and 2.30 — each stroke now has a solid interior pixel with the
     antialiasing confined to its edges. */
  width: 36px; height: 36px;
  flex: 0 0 36px;
  /* controls stay clickable; bubble.js excludes them from the drag */
  cursor: pointer;
  transition: filter 320ms ease, transform 160ms ease;
  filter: var(--neuron-idle);
}
#glyph:active { transform: scale(0.94); }

/* The unread dot: "open me when you can", not a modal.
 *
 * It lights in the UNREAD state, not the speaking one. Lighting it beside a
 * message already spelled out on screen made it decoration — it said "there
 * is something here" while the something was legible an inch to its right.
 *
 * Its job starts when the text withdraws: after a while unacknowledged she
 * collapses back to the glyph, and the dot is what is left. That is the whole
 * "open me when you can" idea — a sentence someone did not read must not sit
 * over their work forever, and it must not vanish without a trace either. */
#glyph-wrap { position: relative; display: flex; }
#dot {
  /* On the disc's RIM, not inside it. Tucked against the glyph it landed
     within the neuron's own glow and read as a smudge on the artwork rather
     than as a mark about it. The dark ring punches it back out of the glow. */
  position: absolute; top: -3px; right: -3px;
  width: 10px; height: 10px; border-radius: 50%;
  background: #ff9d6e;
  border: 2px solid rgba(20,18,30,0.92);
  opacity: 0; transform: scale(0.4);
  transition: opacity 180ms ease, transform 180ms ease;
}
#pill.unread #dot { opacity: 1; transform: scale(1); }
#pill.unread #glyph, #pill.speaking #glyph { filter: var(--neuron-live); }

/* Working: she has the message and does not have an answer yet.
 *
 * Deliberately NOT the unread dot. Nothing is waiting to be read, and a mark
 * that says "there is something here" while there is not is the decoration
 * the dot was moved off the glyph to avoid being. A slow breath on the mark
 * itself says the same thing the composer's three dots say, in the one
 * element a 40px bubble has.
 *
 * The companion window keeps running while ordered out, so this is the only
 * surface a person who collapsed her mid-turn can learn anything from. */
#pill.working #glyph {
  filter: var(--neuron-live);
  animation: bubble-working 1.9s ease-in-out infinite;
}
@keyframes bubble-working {
  0%, 100% { opacity: 0.45; }
  50%      { opacity: 1; }
}

#say {
  /* controls stay clickable; bubble.js excludes them from the drag */
  color: var(--bubble-text);
  font-size: 13px;
  line-height: 1.35;
  max-width: 460px;
  max-height: 9.5em;
  overflow-y: auto;
  overflow-wrap: anywhere;
  cursor: pointer;
}
#pill.dormant #say, #pill.dormant #close { display: none; }

#close {
  /* controls stay clickable; bubble.js excludes them from the drag */
  flex: 0 0 auto;
  width: 20px; height: 20px;
  border: 0; border-radius: 50%;
  background: transparent;
  color: var(--bubble-dim);
  font-size: 15px; line-height: 1;
  cursor: pointer;
}
#close:hover { color: var(--bubble-text); background: rgba(255,255,255,0.08); }

@media (prefers-reduced-motion: reduce) {
  #pill, #glyph, #dot { transition: none; }
  /* The state still has to be legible without the breath, or reduced motion
     would mean no working indicator at all. */
  #pill.working #glyph { animation: none; opacity: 0.75; }
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Aura</h1>
<div id="pill" class="dormant" role="status" aria-live="polite">
  <div id="glyph-wrap">
    <img id="glyph" src="/static/neuron_glyph.svg" alt="Aura" title="Aura" draggable="false"/>
    <span id="dot" aria-hidden="true"></span>
  </div>
  <div id="say"></div>
  <button id="close" title="Clear" aria-label="Clear message">×</button>
</div>

<script src="/static/bubble.js" defer></script>
</body>
</html>
