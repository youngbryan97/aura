[package]
name = "aura-board-search"
version = "0.1.0"
edition = "2021"

[lib]
name = "aura_board_search"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
