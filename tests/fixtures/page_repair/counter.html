<!doctype html>
<html><head><meta charset="utf-8"><title>Counter</title></head>
<body>
<h1>Counter</h1>
<p>Count: <span id="count">0</span></p>
<label>Step <input id="step" type="number" value="1"></label>
<button id="more" onclick="more()">+</button>
<button id="less" onclick="less()">-</button>
<button id="reset" onclick="resetCount()">Reset</button>
<script>
let count = 0;
function step() { return Number(document.getElementById("step").value) || 1; }
function show() { document.getElementById("count").textContent = String(count); }
function more() { count += step() * 0; show(); }
function less() { count -= step(); show(); }
function resetCount() { count = 0; show(); noteTheReset(); }
</script>
</body></html>
