<!doctype html><html><head><meta charset="utf-8"><title>Collect</title></head><body>
<script src="world.js"></script>
<script>
// Coins to pick up, wanderers to keep away from.
const game = {
  title: "COLLECT", rules: ["Arrow keys to walk.", "Pick up the coins.", "The red ones hurt."],
  reset(world) {
    this.me = { x: 232, y: 170, w: 16, h: 16 }; this.coins = []; this.foes = [];
    for (let i = 0; i < 3; i++) this.foes.push({ x: 40 + world.rand() * 400, y: 40 + world.rand() * 60, w: 16, h: 16, vx: (world.rand() < .5 ? -1 : 1) * 70, vy: (world.rand() < .5 ? -1 : 1) * 55 });
    this.safe = 1;
  },
  step(dt, world) {
    const me = this.me, v = 150 * dt;
    if (world.held.has("ArrowLeft")) me.x -= v;
    if (world.held.has("ArrowRight")) me.x += v;
    if (world.held.has("ArrowUp")) me.y -= v;
    if (world.held.has("ArrowDown")) me.y += v;
    me.x = Math.max(0, Math.min(world.W - me.w, me.x)); me.y = Math.max(30, Math.min(world.H - me.h, me.y));
    while (this.coins.length < 3) this.coins.push({ x: 10 + world.rand() * 450, y: 40 + world.rand() * 260, w: 12, h: 12 });
    this.safe -= dt;
    for (const c of this.coins) if (hits(c, me)) { c.gone = true; world.score += 5; }
    this.coins = this.coins.filter((c) => !c.gone);
    for (const f of this.foes) {
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < 0 || f.x > world.W - f.w) f.vx *= -1;
      if (f.y < 30 || f.y > world.H - f.h) f.vy *= -1;
      if (this.safe <= 0 && hits(f, me)) { world.lose(); this.safe = 1.2; me.x = 232; me.y = 170; }
    }
  },
  backdrop(ctx) {
    ctx.fillStyle = "#2b2b2b"; ctx.fillRect(0, 0, 480, 320);
    ctx.fillStyle = "#333";
    for (let x = 0; x < 480; x += 32) for (let y = 30; y < 320; y += 32) if ((x + y) % 64 === 0) ctx.fillRect(x, y, 32, 32);
  },
  draw(ctx) {
    ctx.fillStyle = "#ffd700"; for (const c of this.coins) { ctx.beginPath(); ctx.arc(c.x + 6, c.y + 6, 6, 0, 6.3); ctx.fill(); }
    ctx.fillStyle = "#e33"; for (const f of this.foes) ctx.fillRect(f.x, f.y, f.w, f.h);
    if (this.safe <= 0 || Math.floor(this.safe * 10) % 2 === 0) { ctx.fillStyle = "#4aa3ff"; ctx.fillRect(this.me.x, this.me.y, 16, 16); }
  },
  readouts: scoreAndLives,
};
playWorld(game);
</script></body></html>
